name: Drift-based Model Retraining

on:
  schedule:
    - cron: '0 */12 * * *'  # Setiap 12 jam
  workflow_dispatch:          # Bisa dijalankan manual

jobs:
  check-and-retrain:
    runs-on: ubuntu-latest

    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fresh streaming data from Kraken
        run: python src/data/stream_generator.py

      - name: Preprocess streaming data
        run: python src/data/stream_preprocessor.py

      - name: Check data drift
        id: drift_check
        run: |
          python src/monitoring/drift_detector.py
          echo "drift_detected=$?" >> $GITHUB_OUTPUT

      - name: Skip retraining if no drift
        if: steps.drift_check.outputs.drift_detected == '0'
        run: |
          echo "✅ No drift detected — skipping retraining"
          echo "Model is still relevant, no action needed"

      - name: Retrain model if drift detected
        if: steps.drift_check.outputs.drift_detected == '1'
        run: |
          echo "⚠️ Drift detected — starting retraining pipeline"
          python src/models/train.py

      - name: Evaluate and promote model if drift detected
        if: steps.drift_check.outputs.drift_detected == '1'
        run: python src/models/evaluate_and_promote.py

      - name: Print comparison report if retrained
        if: steps.drift_check.outputs.drift_detected == '1'
        run: cat reports/model_comparison.json

      - name: Commit updated model if retrained
        if: steps.drift_check.outputs.drift_detected == '1'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add models/ reports/ data/processed/streaming/ || true
          git commit -m "chore: drift-triggered retrain - model updated" || echo "No changes to commit"
          git push || echo "Nothing to push"