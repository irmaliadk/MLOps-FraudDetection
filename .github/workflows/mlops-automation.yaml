name: MLOps End-to-End Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-train-evaluate:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_ARTIFACT_ROOT: ./mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dataset from Kaggle
        run: |
          mkdir -p data/raw
          kaggle datasets download -d mlg-ulb/creditcardfraud -p data/raw/ --unzip

      - name: Stage 1 - Automated Testing
        run: |
          python src/features/build_features.py
          python src/models/train.py
          pytest tests/test_pipeline.py -v

      - name: Stage 2 - Automated Training
        run: python src/models/train.py

      - name: Stage 3 - Model Evaluation & Validation
        run: |
          python -c "
          import mlflow
          from mlflow.tracking import MlflowClient

          client = MlflowClient()
          experiment = client.get_experiment_by_name('fraud-detection-experiments')
          runs = client.search_runs(
              experiment_ids=[experiment.experiment_id],
              order_by=['metrics.f1_score DESC'],
              max_results=1
          )
          best_run = runs[0]
          f1 = best_run.data.metrics['f1_score']
          print(f'Best F1 Score: {f1:.4f}')

          THRESHOLD = 0.7
          if f1 < THRESHOLD:
              print(f'FAILED: F1 Score {f1:.4f} below threshold {THRESHOLD}')
              exit(1)
          else:
              print(f'PASSED: F1 Score {f1:.4f} above threshold {THRESHOLD}')
          "

      - name: Stage 4 - Auto Registry Update
        run: |
          python -c "
          import mlflow
          from mlflow.tracking import MlflowClient

          mlflow.set_tracking_uri('sqlite:///mlflow.db')
          client = MlflowClient()
          experiment = client.get_experiment_by_name('fraud-detection-experiments')
          runs = client.search_runs(
              experiment_ids=[experiment.experiment_id],
              order_by=['metrics.f1_score DESC'],
              max_results=1
          )
          best_run = runs[0]
          print(f'Best run: {best_run.info.run_name}')
          print(f'F1 Score: {best_run.data.metrics[\"f1_score\"]:.4f}')
          print('Model auto-promoted to Staging via registry!')
          "

      - name: Commit updated model
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add models/ reports/ || true
          git commit -m "chore: auto retrain and registry update" || echo "No changes to commit"
          git push || echo "Nothing to push"