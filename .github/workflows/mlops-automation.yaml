name: MLOps End-to-End Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  test-train-evaluate:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_ARTIFACT_ROOT: ./mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch streaming data from Binance
        run: python src/data/stream_generator.py

      - name: Preprocess streaming data
        run: python src/data/stream_preprocessor.py

      - name: Stage 1 - Automated Testing (pre-training)
        run: pytest tests/test_pipeline.py -v -k "not test_model_exists"

      - name: Setup MLflow environment
        run: |
          mkdir -p ./mlruns
          rm -f mlflow.db
          export MLFLOW_ARTIFACT_ROOT=$(pwd)/mlruns
          echo "MLFLOW_ARTIFACT_ROOT=$(pwd)/mlruns" >> $GITHUB_ENV

      - name: Stage 2 - Automated Training
        run: python src/models/train.py

      - name: Stage 2b - Validate model artifact exists
        run: pytest tests/test_pipeline.py::test_model_exists -v

      - name: Stage 3 - Model Evaluation & Validation
        run: |
          python -c "
          import mlflow
          from mlflow.tracking import MlflowClient

          mlflow.set_tracking_uri('sqlite:///mlflow.db')
          client = MlflowClient()
          experiment = client.get_experiment_by_name('fraud-detection-experiments')
          runs = client.search_runs(
              experiment_ids=[experiment.experiment_id],
              order_by=['metrics.f1_score DESC'],
              max_results=1
          )
          best_run = runs[0]
          f1 = best_run.data.metrics['f1_score']
          print(f'Best F1 Score: {f1:.4f}')

          THRESHOLD = 0.7
          if f1 < THRESHOLD:
              print(f'FAILED: F1 Score {f1:.4f} below threshold {THRESHOLD}')
              exit(1)
          else:
              print(f'PASSED: F1 Score {f1:.4f} above threshold {THRESHOLD}')
          "

      - name: Stage 4 - Auto Registry Update
        run: python src/models/register_model.py

      - name: Commit updated model
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add models/ reports/ data/processed/streaming/ || true
          git commit -m "chore: auto retrain with fresh Binance streaming data" || echo "No changes to commit"
          git push || echo "Nothing to push"
