name: Weekly Model Retrain

on:
  schedule:
    - cron: '0 0 * * 0'  # Setiap Minggu jam 00:00
  workflow_dispatch:       # Bisa dijalankan manual

jobs:
  retrain:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_ARTIFACT_ROOT: ./mlruns
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup MLflow environment
        run: |
          mkdir -p ./mlruns
          rm -f mlflow.db
          export MLFLOW_ARTIFACT_ROOT=$(pwd)/mlruns
          echo "MLFLOW_ARTIFACT_ROOT=$(pwd)/mlruns" >> $GITHUB_ENV

      - name: Fetch fresh streaming data from Kraken
        run: python src/data/stream_generator.py

      - name: Preprocess streaming data
        run: python src/data/stream_preprocessor.py

      - name: Check data drift
        id: drift_check
        run: |
          python src/monitoring/drift_detector.py
          echo "drift_exit=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run model training
        run: python src/models/train.py

      - name: Evaluate and promote model
        run: python src/models/evaluate_and_promote.py

      - name: Print comparison report
        run: cat reports/model_comparison.json

      - name: Commit updated model and reports
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add models/ reports/ data/processed/streaming/ || true
          git commit -m "chore: weekly retrain with fresh Kraken streaming data" || echo "No changes to commit"
          git push || echo "Nothing to push"