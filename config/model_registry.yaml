model_registry:
  name: fraud-detection-best-model
  active_version: 4
  stage: Production
  algorithm: LogisticRegression
  parameters:
    C: 0.1
    max_iter: 1000
    class_weight: balanced
  metrics:
    f1_score: 0.8571
    roc_auc: 0.9891
    precision: 0.7500
    recall: 1.0000
  data_source:
    type: Binance Public API
    symbol: BTCUSDT
    ingestion_script: src/data/stream_generator.py
    preprocessing_script: src/data/stream_preprocessor.py
    raw_data: data/raw/streaming/
    processed_data: data/processed/streaming/
  notes: >
    Model terbaik dipilih berdasarkan F1 Score tertinggi (0.8571)
    dari 4 eksperimen. LogisticRegression dengan C=0.1 mengungguli
    RandomForest dan DecisionTree pada data streaming Binance BTCUSDT.