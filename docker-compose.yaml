services:

  mlflow-server:
    image: python:3.10-slim
    container_name: mlflow-server
    working_dir: /mlflow
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "5000:5000"
    networks:
      - mlops-network
    command: >
      bash -c "pip install mlflow -q &&
               mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri sqlite:///mlflow.db
               --default-artifact-root /mlflow/artifacts
               --allowed-hosts '*'
               --cors-allowed-origins '*'"

  api-service:
    build: .
    ports:
      - "8000-8002:8000"
    networks:
      - mlops-network
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    depends_on:
      - mlflow-server
    volumes:
      - model-data:/app/models
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 512M

networks:
  mlops-network:
    driver: bridge

volumes:
  mlflow-data:
  model-data: