global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "prometheus_alerts.yml"

scrape_configs:
  - job_name: 'fraud-detection-api'
    static_configs:
      - targets:
          - 'fraud-detection-api-1:8000'
          - 'fraud-detection-api-2:8000'
          - 'fraud-detection-api-3:8000'
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']